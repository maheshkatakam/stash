name: Build Stash APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STASH_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            {
              echo "STASH_KEYSTORE_PATH=$GITHUB_WORKSPACE/signing/stash-release.p12"
              echo "STASH_KEY_ALIAS=stash"
            } >> "$GITHUB_ENV"
            echo "Using the Stash release key."
          else
            echo "::warning::STASH_KEYSTORE_PASSWORD secret is missing, so this APK is signed with a temporary key and won't install over earlier versions."
          fi

      - name: Build release APK
        env:
          STASH_KEYSTORE_PASSWORD: ${{ secrets.STASH_KEYSTORE_PASSWORD }}
          STASH_VERSION_CODE: ${{ github.run_number }}
          STASH_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Stash-1.0.${{ github.run_number }}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Stash-1.0.${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && env.STASH_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" dist/*.apk \
            --title "Stash 1.0.${{ github.run_number }}" \
            --notes "Download the APK below on your phone and open it to install or update Stash. Updating keeps all your saved items." \
            --latest
